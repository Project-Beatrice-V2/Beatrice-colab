name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    name: Notebook validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install nbformat==5.10.4
      - name: Validate Colab and Kaggle notebooks
        run: |
          python - <<'PYTHON'
          from pathlib import Path

          import nbformat

          for platform in ('Colab', 'Kaggle'):
              path = Path(f'BeatriceV2_Trainer_Notebook_{platform}.ipynb')
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              print(f'Validated {path}')
          PYTHON
